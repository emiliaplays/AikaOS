name: Build installer development ISO

on:
  workflow_dispatch:
  push:
    branches: [feature/calamares-installer]
    paths:
      - installer/**
      - packages/**
      - scripts/**
      - profile/**
      - tests/**
      - .github/workflows/build-installer-image.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build packages and ISO in a disposable Arch Linux container
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            archlinux:base-devel bash -euc '
              pacman -Syu --noconfirm --needed archiso grub libisoburn squashfs-tools mtools dosfstools ttf-dejavu python python-yaml python-jsonschema git cmake extra-cmake-modules ninja qt6-tools qt6-translations kcoreaddons kpmcore libpwquality polkit-qt6 qt6-declarative qt6-svg qt6-wayland yaml-cpp rsync parted gptfdisk e2fsprogs efibootmgr mkinitcpio os-prober
              git config --global --add safe.directory /workspace
              python3 tests/test-installer-guard.py
              useradd --create-home builder
              mkdir -p out
              chown builder:builder out
              su builder -c "cd /workspace && export MAKEFLAGS=-j$(nproc) CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) && bash scripts/build-packages.sh"
              python3 scripts/validate-installer.py --upstream out/package-build/calamares/src/calamares
              AIKAOS_INSTALLER=1 bash scripts/build.sh
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aikaos-installer-development
          path: |
            out/aikaos-11.1-installer-dev-x86_64.iso
            out/aikaos-11.1-installer-dev-x86_64.iso.sha256
            out/boot-report.txt
            out/fastfetch-build-check.txt
          compression-level: 0
          retention-days: 1
