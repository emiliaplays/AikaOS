name: Validate live profile

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release profile and public files
        run: python3 scripts/validate.py
      - name: Check build script syntax
        run: bash -n scripts/build.sh
