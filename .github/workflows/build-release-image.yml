name: Build AikaOS 11.1 release image

on:
  workflow_dispatch:
  push:
    branches: [release/11.1]
    paths:
      - installer/**
      - packages/**
      - scripts/**
      - profile/**
      - tests/**
      - .github/workflows/build-release-image.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the installer package and stable image from source
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            archlinux:base-devel bash -euc '
              pacman -Syu --noconfirm --needed archiso grub libisoburn squashfs-tools mtools dosfstools ttf-dejavu python python-yaml python-jsonschema git cmake extra-cmake-modules ninja qt6-tools qt6-translations kcoreaddons kpmcore libpwquality polkit-qt6 qt6-declarative qt6-svg qt6-wayland yaml-cpp rsync parted gptfdisk e2fsprogs efibootmgr mkinitcpio os-prober perl xkeyboard-config
              git config --global --add safe.directory /workspace
              python3 tests/test-installer-guard.py
              useradd --create-home builder
              mkdir -p out
              chown builder:builder out
              su builder -c "cd /workspace && export MAKEFLAGS=-j$(nproc) CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) && bash scripts/build-packages.sh"
              python3 scripts/validate-installer.py --upstream out/package-build/calamares/src/calamares
              AIKAOS_INSTALLER=1 AIKAOS_CHANNEL=stable bash scripts/build.sh
            '
          sudo chown "$(id -u):$(id -g)" out
      - name: Attest the image and release metadata
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            out/aikaos-11.1-stable-x86_64.iso
            out/aikaos-11.1-stable-x86_64.iso.sha256
            out/build-manifest.json
            out/packages.x86_64.txt
      - name: Preserve the verification bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" out/aikaos-11.1.intoto.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aikaos-11.1-release-candidate
          path: |
            out/aikaos-11.1-stable-x86_64.iso
            out/aikaos-11.1-stable-x86_64.iso.sha256
            out/aikaos-11.1.intoto.jsonl
            out/build-manifest.json
            out/packages.x86_64.txt
            out/boot-report.txt
            out/fastfetch-build-check.txt
            out/keyboard-preview-build-check.txt
            out/microcode-build-check.txt
            out/release-profile-check.txt
          compression-level: 0
          retention-days: 3
