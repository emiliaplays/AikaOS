---
modules-search: [local]
instances:
  - id: prepare
    module: aikaos
    config: aikaos-prepare.conf
  - id: finalize
    module: aikaos
    config: aikaos-finalize.conf
sequence:
  - show: [welcome, locale, keyboard, partition, users, summary]
  - exec:
      - partition
      - mount
      - unpackfs
      - aikaos@prepare
      - removeuser
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      - initcpiocfg
      - initcpio
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - aikaos@finalize
      - umount
  - show: [finished]
branding: aikaos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
quit-at-end: false
